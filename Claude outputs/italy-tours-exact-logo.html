<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Italy Tours - Exact Logo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo-box {
            width: 450px;
            height: 500px;
            margin: 0 auto 30px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h2 {
            color: #333;
            margin: 20px 0;
        }
        p {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Italy Tours Affiliate Network</h2>

        <div class="logo-box">
            <svg width="420" height="480" viewBox="0 0 420 480">
                <defs>
                    <!-- Main gradient for pin -->
                    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <!-- Red/Orange sunset top -->
                        <stop offset="0%" style="stop-color:#FF4500;stop-opacity:1" />
                        <stop offset="8%" style="stop-color:#FF6347;stop-opacity:1" />
                        <stop offset="18%" style="stop-color:#FF8C00;stop-opacity:1" />
                        <stop offset="35%" style="stop-color:#FFA500;stop-opacity:1" />
                        <!-- Yellow middle -->
                        <stop offset="45%" style="stop-color:#FFD700;stop-opacity:1" />
                        <stop offset="55%" style="stop-color:#FFED4E;stop-opacity:1" />
                        <!-- Sky blue transition -->
                        <stop offset="70%" style="stop-color:#87CEEB;stop-opacity:1" />
                        <stop offset="85%" style="stop-color:#4ECDC4;stop-opacity:1" />
                        <!-- Ocean blue -->
                        <stop offset="100%" style="stop-color:#0099CC;stop-opacity:1" />
                    </linearGradient>

                    <!-- Water gradient -->
                    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:0.8" />
                        <stop offset="50%" style="stop-color:#4ECDC4;stop-opacity:0.85" />
                        <stop offset="100%" style="stop-color:#0099CC;stop-opacity:0.9" />
                    </linearGradient>

                    <filter id="shadow">
                        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity="0.18"/>
                    </filter>
                </defs>

                <!-- MAIN MAP PIN SHAPE -->
                <path d="M 210 30 C 160 30 125 65 125 120 C 125 185 210 350 210 350 C 210 350 295 185 295 120 C 295 65 260 30 210 30 Z"
                      fill="url(#pinGrad)"
                      stroke="#1a1a1a"
                      stroke-width="6"
                      stroke-linejoin="round"
                      stroke-linecap="round"
                      filter="url(#shadow)"/>

                <!-- Inner white circle (highlight) -->
                <circle cx="210" cy="125" r="38" fill="white" stroke="#1a1a1a" stroke-width="2.5"/>

                <!-- Sunset circle layers -->
                <circle cx="210" cy="125" r="34" fill="#FFD700" opacity="0.96"/>
                <circle cx="210" cy="125" r="26" fill="#FF8C00" opacity="0.92"/>
                <circle cx="210" cy="125" r="18" fill="#FF6347" opacity="0.95"/>

                <!-- Bird silhouettes (top right) -->
                <g stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round">
                    <path d="M 290 90 Q 310 80 330 95"/>
                    <path d="M 310 85 Q 325 78 345 88"/>
                </g>

                <!-- PALM TREE (LEFT SIDE) - DETAILED -->
                <g transform="translate(95, 150)">
                    <!-- Trunk -->
                    <ellipse cx="0" cy="50" rx="8" ry="55" fill="#8B6914" stroke="#1a1a1a" stroke-width="1.5" opacity="0.95"/>

                    <!-- Palm Fronds (detailed, realistic) -->
                    <g stroke="#1a1a1a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Top left cluster -->
                        <path d="M -3 -12 L -45 -65"/>
                        <path d="M -3 -12 L -40 -72"/>
                        <path d="M -3 -12 L -38 -58"/>

                        <!-- Top right cluster -->
                        <path d="M 3 -12 L 45 -65"/>
                        <path d="M 3 -12 L 40 -72"/>
                        <path d="M 3 -12 L 38 -58"/>

                        <!-- Middle left -->
                        <path d="M -3 -8 L -32 -35"/>
                        <path d="M -3 -8 L -28 -42"/>

                        <!-- Middle right -->
                        <path d="M 3 -8 L 32 -35"/>
                        <path d="M 3 -8 L 28 -42"/>
                    </g>

                    <!-- Palm bulb/center -->
                    <circle cx="0" cy="-12" r="6" fill="#1a1a1a"/>
                </g>

                <!-- WATER WAVES (BOTTOM SECTION) -->
                <!-- Wave pattern 1 (top wave) -->
                <path d="M 130 300 Q 155 285 180 305 Q 210 330 235 310 Q 260 290 285 310 Q 300 325 310 315"
                      fill="none" stroke="white" stroke-width="3.5" opacity="0.9" stroke-linecap="round"/>

                <!-- Wave pattern 2 (middle wave) -->
                <path d="M 125 330 Q 165 315 210 335 Q 255 355 295 330 Q 310 320 315 330"
                      fill="none" stroke="white" stroke-width="2.5" opacity="0.7" stroke-linecap="round"/>

                <!-- Water fill polygon (bottom section) -->
                <polygon points="125,310 295,310 280,380 140,380" fill="url(#waterGrad)" opacity="0.85"/>

                <!-- Darker water (bottom) -->
                <polygon points="125,380 295,380 265,430 155,430" fill="#0099CC" opacity="0.9"/>

                <!-- Water highlight/reflection -->
                <ellipse cx="210" cy="350" rx="60" ry="20" fill="white" opacity="0.15"/>
            </svg>
        </div>

        <p style="margin-top: 30px; color: #555; font-size: 13px;">
            ✓ Exact design matching reference<br/>
            ✓ Proper water waves pattern<br/>
            ✓ Detailed palm tree fronds<br/>
            ✓ Accurate color gradients<br/>
            ✓ Professional quality
        </p>
    </div>
</body>
</html>
