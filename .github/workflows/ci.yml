name: CI

# Runs on every push/PR to main: typecheck and a real production build.
# Two independent jobs so a typecheck failure doesn't block you from seeing
# whether the build would also have passed.
#
# The previous third job (M10 governance scan for duplicate content /
# cross-links between owned sites) was removed along with Payload CMS — it
# was a `beforeValidate` hook on the Pages collection
# (cms/src/hooks/governanceCheck.ts), and Firestore has no equivalent
# server-side hook on a direct Console edit. There's currently no automated
# backstop for those two platform rules; re-introduce one (e.g. a scheduled
# Cloud Function, or a script run by hand before publishing new pages) if
# they matter again once there's more than one tenant site's worth of content.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # CI-only, not real secrets.
  REVALIDATE_SECRET: ci-only-secret-not-used-for-anything-real

jobs:
  red-palette-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for red color values (§5.3 of blueprint)
        run: |
          echo "Scanning apps/web for forbidden red color values..."
          set +e
          grep -r "255 0 34\|255,0,34\|#ff0022\|#FF0022\|#e0001d\|224 0 29" \
            apps/web/src --include="*.tsx" --include="*.ts" --include="*.jsx" --include="*.js" --include="*.css" \
            --exclude-dir=node_modules --exclude-dir=.next 2>/dev/null
          if [ $? -eq 0 ]; then
            echo "❌ FAIL: Red color values found in the codebase."
            exit 1
          fi
          echo "✓ PASS: No red color values found."
          exit 0

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck all packages
        run: pnpm turbo run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Production build (apps/web)
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: pnpm turbo run build --filter=@italy-tours/web
